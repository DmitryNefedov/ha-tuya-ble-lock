name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip integration
        run: cd custom_components/tuya_ble_lock && zip -r ../../tuya_ble_lock.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: tuya_ble_lock.zip
          generate_release_notes: true
